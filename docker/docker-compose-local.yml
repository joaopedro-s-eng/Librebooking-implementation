name: librebooking

services:
  db:
    image: ${DOCKER_DB_IMAGE:-linuxserver/mariadb}:${DOCKER_DB_TAG:-10.6.13}
    restart: always
    volumes:
      - db_conf:/config
    env_file:
      - db.env
  app:
    image: ${DOCKER_APP_IMAGE:-librebooking/librebooking}:${DOCKER_APP_TAG:-develop}
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
    ports:
      - "8081:8080"
    volumes:
      - app_conf:/config
      - app_img:/var/www/html/Web/uploads/images
      - app_res:/var/www/html/Web/uploads/reservation
    env_file:
      - lb.env


  keycloak:
    image: quay.io/keycloak/keycloak:latest
    restart: always
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    depends_on:
      - db
    ports:
     - "8082:8080"
    volumes:
      - app_conf:/config

  cron:
    image: ${DOCKER_APP_IMAGE:-librebooking/librebooking}:${DOCKER_APP_TAG:-develop}
    restart: always
    command: supercronic /config/lb-jobs-cron
    depends_on:
      - app
    volumes_from:
      - app
    volumes:
      - ./crontab:/config/lb-jobs-cron:ro
    env_file:
      - lb.env

volumes:
  db_conf:
  app_conf:
  app_img:
  app_res:
  keycloak:
